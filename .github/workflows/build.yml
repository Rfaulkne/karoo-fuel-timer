name: Build and Release Karoo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fuel-timer-debug-keystore-v1
      - name: Build APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KarooFuelTimer.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KarooFuelTimer-v0.5
          path: KarooFuelTimer.apk
          if-no-files-found: error
      - name: Publish v0.5 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.5 >/dev/null 2>&1; then
            gh release upload v0.5 KarooFuelTimer.apk --clobber
          else
            gh release create v0.5 KarooFuelTimer.apk --title "Fuel Timer v0.5" --notes "Per-category totals, low-power refresh, and per-ride reset."
          fi
